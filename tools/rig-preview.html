<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Rig preview</title>
<link rel="stylesheet" href="../css/tokens.css">
<style>
  /* OWNER: A2. Contact sheets for the figure rig + MOI frame strips.
     ?mode=sheet&view=lateral|anterior&page=0&per=24&kit=athlete   all POSE_PRESETS
     ?mode=moi&injury=<id>&n=8                                       moi phase of an injury at n times
     ?mode=figures                                                   exercise thumbnails at 160×120 (light page)
     ?mode=kits                                                      every kit, stand + run
     ?mode=pose&pose=<id>                                            one preset, large, both views */
  body { margin: 0; background: var(--stage-bg); color: var(--stage-ink); font: 13px/1.3 system-ui, sans-serif; }
  body.light { background: var(--paper); color: var(--ink); }
  h1 { font-size: 15px; margin: 10px 12px; font-weight: 600; }
  #grid { display: grid; gap: 6px; padding: 6px 10px 12px; }
  .cell { background: var(--stage-bg-2); border-radius: 6px; padding: 4px; }
  body.light .cell { background: var(--surface); border: 1px solid var(--line); }
  .cell svg { display: block; width: 100%; height: auto; }
  .name { font: 600 12px/1.2 system-ui; margin: 3px 4px 0; color: var(--stage-accent); }
  body.light .name { color: var(--accent); }
  .desc { font-size: 10.5px; color: var(--stage-ink-2); margin: 1px 4px 2px; height: 2.5em; overflow: hidden; }
  #err { color: #ff8a80; white-space: pre-wrap; margin: 8px 12px; }
</style></head>
<body>
<h1 id="title"></h1><div id="err"></div><div id="grid"></div>
<script type="module">
const q = new URLSearchParams(location.search);
const mode = q.get("mode") || "sheet";
const NS = "http://www.w3.org/2000/svg";
const errs = []; window.__errors = errs;
const warn = (m) => errs.push(String(m));
const grid = document.getElementById("grid"), title = document.getElementById("title");
const cell = (name, desc) => { const c = document.createElement("div"); c.className = "cell"; grid.append(c); const n = document.createElement("div"); n.className = "name"; n.textContent = name; const d = document.createElement("div"); d.className = "desc"; d.textContent = desc || ""; return { c, n, d }; };
try {
  const rig = await import("../js/anim/rig.js");
  const cat = await import("../js/anim/catalogue.js");
  const poses = await import("../js/anim/poses.js");
  const missing = Object.keys(cat.POSE_PRESETS).filter((k) => !poses.PRESETS[k]);
  if (missing.length) warn("MISSING presets: " + missing.join(", "));
  if (mode === "sheet") {
    const view = q.get("view") || "lateral", per = +(q.get("per") || 24), page = +(q.get("page") || 0), kit = q.get("kit") || "athlete";
    const ids = Object.keys(cat.POSE_PRESETS), part = ids.slice(page * per, page * per + per);
    title.textContent = `Pose presets — ${view} view — page ${page + 1}/${Math.ceil(ids.length / per)} (${ids.length} presets)`;
    grid.style.gridTemplateColumns = "repeat(6, 1fr)";
    for (const id of part) {
      const { c, n, d } = cell(id, cat.POSE_PRESETS[id]);
      const fallback = view === "anterior" && !rig.hasView(id, "anterior");
      if (fallback) n.textContent += "  (lateral fallback)";
      c.append(rig.renderFigure({ view, pose: id, width: 250, height: 200, kit, padding: 0.08 }), n, d);
    }
  } else if (mode === "figures") {
    document.body.className = "light";
    const ids = Object.keys(cat.POSE_PRESETS).filter((k) => k.startsWith("ex-"));
    const PROPS = { "ex-quad-set": ["mat"], "ex-heel-slide": ["mat"], "ex-straight-leg-raise": ["mat"], "ex-bridge": ["mat"], "ex-single-leg-bridge": ["mat"], "ex-hamstring-bridge": ["box"], "ex-hip-thrust": ["bench"], "ex-clamshell": ["mat"], "ex-side-plank": ["mat"], "ex-plank": ["mat"], "ex-bird-dog": ["mat"], "ex-dead-bug": ["mat"], "ex-copenhagen": ["bench"],
      "ex-split-squat": ["dumbbell"], "ex-step-up": ["box"], "ex-step-down": ["step"], "ex-wall-sit": ["wall"], "ex-rdl": ["dumbbell"], "ex-knee-extension": ["chair"], "ex-shoulder-er-side-lying": ["dumbbell", "mat"], "ex-shoulder-er-band": ["resistance-band"], "ex-pendulum": ["bench"],
      "ex-wall-slide": ["wall"], "ex-row": ["dumbbell"], "ex-overhead-press": ["dumbbell"], "ex-wrist-extension": ["dumbbell"], "ex-wrist-flexion": ["dumbbell"], "ex-grip": ["ball-tennis"], "ex-thoracic-extension": ["foam-roller"], "ex-farmer-carry": ["kettlebell"], "ex-scaption": ["dumbbell"], "ex-nordic": ["mat"], "ex-chin-tuck": ["mat"], "ex-knee-to-chest": ["mat"], "ex-prone-y": ["mat"], "ex-prone-press-up": ["mat"], "ex-cat-camel": ["mat"], "ex-press-up": ["mat"] };
    const view = q.get("view") || "lateral";
    title.textContent = `Exercise figures at 160×120 (${view}), with typical props`;
    grid.style.gridTemplateColumns = "repeat(8, 168px)";
    for (const id of ids) { const { c, n } = cell(id); c.append(rig.renderFigure({ view, pose: id, props: PROPS[id] || [], width: 160, height: 120 }), n); }
  } else if (mode === "kits") {
    title.textContent = "Kits";
    grid.style.gridTemplateColumns = "repeat(5, 1fr)";
    for (const view of ["lateral", "anterior"]) for (const kit of cat.KITS) for (const pose of ["stand", "run-midstance"]) {
      const { c, n } = cell(`${kit} · ${pose} · ${view}`);
      c.append(rig.renderFigure({ view, pose, kit, width: 260, height: 220 }), n);
    }
    grid.style.gridTemplateColumns = "repeat(4, 1fr)";
  } else if (mode === "pose") {
    const id = q.get("pose") || "stand";
    title.textContent = `${id} — ${cat.POSE_PRESETS[id] || "?"}`;
    grid.style.gridTemplateColumns = "1fr 1fr";
    for (const view of ["lateral", "anterior"]) { const { c, n } = cell(view); c.append(rig.renderFigure({ view, pose: id, width: 560, height: 460, props: (q.get("props") || "").split(",").filter(Boolean) }), n); }
  } else if (mode === "moi") {
    const id = q.get("injury"), n = +(q.get("n") || 8);
    const list = await (await fetch("../content/catalogue.json")).json();
    const entry = list.find((e) => e.id === id);
    if (!entry) throw new Error("unknown injury " + id);
    const inj = (await import(`../content/injuries/${entry.region}/${id}.js?t=${Date.now()}`)).default;
    const phase = inj.animation.phases.find((p) => p.type === "moi");
    const { renderMoiFrame, moiBounds } = await import("../js/anim/moi.js");
    title.textContent = `${id} — moi (${phase.view}, ${phase.environment || "plain"}, ${phase.duration}s)`;
    grid.style.gridTemplateColumns = "repeat(2, 1fr)";
    const ext = moiBounds(phase, { warn });
    const pad = 0.18, w = ext.w * (1 + 2 * pad), h = ext.h * (1 + 2 * pad);
    let vw = w, vh = h; if (vw / vh > 16 / 9) vh = vw * 9 / 16; else vw = vh * 16 / 9;
    const cx = ext.x + ext.w / 2, cy = ext.y + ext.h / 2;
    const k = 800 / vw;
    const defs = document.createElementNS(NS, "svg"); defs.setAttribute("width", 0); defs.setAttribute("height", 0); defs.style.position = "absolute";
    const D = document.createElementNS(NS, "defs"); defs.append(D); document.body.append(defs);
    for (let i = 0; i < n; i++) {
      const t = (phase.duration * i) / (n - 1);
      const cap = [...(phase.captions || [])].reverse().find((c) => c.t <= t + 1e-6);
      const { c, n: nm, d } = cell(`t = ${t.toFixed(2)} s`, cap ? cap.text : "");
      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("viewBox", "0 0 800 450");
      const bg = document.createElementNS(NS, "rect"); bg.setAttribute("width", 800); bg.setAttribute("height", 450); bg.setAttribute("style", "fill: var(--stage-bg)"); svg.append(bg);
      const cam = document.createElementNS(NS, "g"); cam.setAttribute("transform", `translate(400 225) scale(${k}) translate(${-cx} ${-cy})`); svg.append(cam);
      const g = document.createElementNS(NS, "g"); cam.append(g);
      const res = renderMoiFrame(g, phase, t, { reducedMotion: false, width: 800, height: 450, defs: D, warn, pxPerCm: k });
      const b = res.bbox, r = document.createElementNS(NS, "rect");
      r.setAttribute("x", b.x); r.setAttribute("y", b.y); r.setAttribute("width", b.w); r.setAttribute("height", b.h);
      r.setAttribute("style", "fill: none; stroke: var(--stage-accent); stroke-width: .4; stroke-dasharray: 2 2; opacity: .5"); g.append(r);
      const kn = res.targets.kneeR; if (kn) { const p = document.createElementNS(NS, "circle"); p.setAttribute("cx", kn[0]); p.setAttribute("cy", kn[1]); p.setAttribute("r", 1); p.setAttribute("style", "fill: var(--stage-accent)"); g.append(p); }
      c.append(svg, nm, d);
    }
  }
} catch (e) { warn(e.stack || e); }
document.getElementById("err").textContent = errs.join("\n");
window.__ready = true;
</script>
</body></html>
